<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김형주 ♥ 이예슬 · 사진 공유</title>
<meta property="og:title" content="김형주 ♥ 이예슬 · 2026.10.18">
<meta property="og:description" content="Captured Forever, Loved for a Lifetime · 오늘의 사진을 나눠 주세요">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbf7f4;--card:#fff;--tx:#3b2f2f;--sub:#8a7a76;--ac:#c98b8b;--ln:#eadfd9}
@media (prefers-color-scheme:dark){:root{--bg:#1d1818;--card:#2a2323;--tx:#f3e9e6;--sub:#b3a39f;--ac:#d9a0a0;--ln:#3d3333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cormorant Garamond","Noto Serif KR",Georgia,"Apple SD Gothic Neo","Malgun Gothic",serif;line-height:1.6;font-size:17px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{text-align:center;padding:44px 20px 20px}
.k{color:var(--ac);letter-spacing:.3em;font-size:13px}
.nm{font-size:22px;font-weight:500;letter-spacing:.08em;margin:4px 0 0}
.tag{font-style:italic;font-weight:500;font-size:24px;color:var(--ac);margin:18px 0 4px;line-height:1.3}
header p{margin:0;color:var(--sub);font-size:14px}
main{max-width:720px;margin:0 auto;padding:0 14px 50px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.btn{display:block;padding:14px;border-radius:10px;background:var(--ac);color:#fff;font-size:17px;text-decoration:none}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
iframe{width:100%;height:70vh;min-height:420px;border:1px solid var(--ln);border-radius:12px;background:#fff}
a.l{color:var(--ac)}
</style>
</head>
<body>
<header>
  <div class="k">2026.10.18</div>
  <p class="nm">김형주 <span style="color:var(--ac)">♥</span> 이예슬</p>
  <div class="tag">Captured Forever, Loved for a Lifetime</div>
  <p>영원히 기록되고, 평생 동안 사랑할 순간</p>
  <p style="margin-top:14px">함께해 주셔서 감사합니다 · 오늘의 사진을 나눠 주세요</p>
</header>
<main>
  <section class="card">
    <a class="btn" href="https://drive.google.com/drive/folders/14n1PtZBfHzPij5OoEY44BC0fg4HHdZU2" target="_blank" rel="noopener">📷 사진 올리기</a>
    <p class="note">구글 계정이 있으면 누구나 올릴 수 있어요.<br>링크를 열고 폴더에 사진을 추가해 주세요.</p>
  </section>
  <section class="card">
    <p style="margin:0 0 10px">올라온 사진</p>
    <iframe src="https://drive.google.com/embeddedfolderview?id=14n1PtZBfHzPij5OoEY44BC0fg4HHdZU2#grid" loading="lazy"></iframe>
    <p class="note">사진이 보이지 않으면 <a class="l" href="https://drive.google.com/drive/folders/14n1PtZBfHzPij5OoEY44BC0fg4HHdZU2" target="_blank" rel="noopener">여기</a>에서 열어 보세요.</p>
  </section>
  <p class="note" style="text-align:center">삭제를 원하시는 사진은 신랑신부에게 말씀해 주세요.</p>
</main>
</body>
</html>
