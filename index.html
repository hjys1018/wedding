<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김형주 ♥ 이예슬 · 사진 공유</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
:root{--bg:#fbf7f4;--card:#fff;--tx:#3b2f2f;--sub:#8a7a76;--ac:#c98b8b;--ln:#eadfd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cormorant Garamond","Noto Serif KR",Georgia,serif;line-height:1.6;font-size:17px}
header{text-align:center;padding:44px 20px 20px}
.k{color:var(--ac);letter-spacing:.3em;font-size:13px}
.nm{font-size:22px;font-weight:500;letter-spacing:.08em;margin:4px 0 0}
.tag{font-style:italic;font-weight:500;font-size:24px;color:var(--ac);margin:18px 0 4px}
header p{margin:0;color:var(--sub);font-size:14px}
main{max-width:720px;margin:0 auto;padding:0 14px 50px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.btn{display:block;padding:14px;border-radius:10px;background:var(--ac);color:#fff;font-size:17px;text-decoration:none}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
.warn{background:#fff4e5;border:1px solid #f0d9b5;color:#7a5a20;border-radius:10px;padding:10px;font-size:13px;margin:0 0 12px;text-align:left}
</style>
</head>
<body>
<header>
  <div class="k">2026.10.18</div>
  <p class="nm">김형주 <span style="color:var(--ac)">♥</span> 이예슬</p>
  <div class="tag">Captured Forever, Loved for a Lifetime</div>
  <p>영원히 기록되고, 평생 동안 사랑할 순간</p>
  <p style="margin-top:14px">함께해 주셔서 감사합니다 · 오늘의 사진을 나눠 주세요</p>
</header>
<main>
  <section class="card">
    <div class="warn">⚠️ <b>구글 계정으로 로그인</b>해야 사진을 올릴 수 있어요.<br>카카오톡에서 열었다면 오른쪽 위 메뉴(⋮)에서 <b>다른 브라우저로 열기</b>를 눌러 주세요.</div>
    <a class="btn" href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fdrive.google.com%2Fdrive%2Ffolders%2F14n1PtZBfHzPij5OoEY44BC0fg4HHdZU2" target="_blank" rel="noopener">📷 구글 로그인하고 사진 올리기</a>
    <p class="note">로그인 후 폴더가 열리면 사진을 추가해 주세요.</p>
  </section>
  <section class="card">
    <a class="btn" style="background:transparent;color:var(--ac);border:1px solid var(--ac)" href="https://drive.google.com/drive/folders/14n1PtZBfHzPij5OoEY44BC0fg4HHdZU2" target="_blank" rel="noopener">🖼 올라온 사진 보기</a>
    <p class="note">하객들이 올린 사진을 함께 볼 수 있어요.</p>
  </section>
  <p class="note" style="text-align:center;opacity:.5">v6</p>
</main>
</body>
</html>
